[workspace]
resolver = "3"
members = [
    "crates/util",
    "crates/scribbles",
    "crates/engine",
    "crates/mcp",
    "crates/ui-egui",
    "apps/magic",
    "apps/magic-cli",
    "apps/magic-tui",
    "xtask",
]

[workspace.package]
version = "0.19.0"
edition = "2024"
license = "LicenseRef-Magic-Studio-NonResale"
rust-version = "1.95"
repository = "https://github.com/jessenaiman/magic"

[workspace.dependencies]
# Internal workspace crates (distinct package names; `magic` is exclusively `apps/magic`)
magic-util = { path = "crates/util" }
magic-scribbles = { path = "crates/scribbles" }
magic-engine = { path = "crates/engine" }
magic-mcp = { path = "crates/mcp" }
magic-ui-egui = { path = "crates/ui-egui" }

# UI toolkit (`storytold/egui` 0.37 family — patched in `[patch.crates-io]` below)
egui = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "x11",
    "wgpu",
    "links",
    "clipboard",
] }
egui_extras = { version = "0.37", default-features = false, features = ["svg", "image", "file"] }

# Shared Craft foundation libraries (`storytold/craft-libs`)
# Optional embedded font & locale checkouts (`CRAFT_FONTS_DIR` and `CRAFT_I18N_DIR`) are read by `crates/util/build.rs`.
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b" }
craft-audio = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b", features = ["decode", "encode", "peaks", "serde"] }
craft-captions = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b" }
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b" }
craft-doc = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b" }
craft-docpath = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b" }
craft-drawingml = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b" }
craft-font-catalog = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b", features = ["system"] }
craft-font-manager = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b", features = ["egui"] }
craft-font-store = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b", features = ["bundled-index"] }
craft-fonts-build = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b" }
craft-keymap = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b", features = ["egui"] }
craft-media = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b", default-features = false, features = ["isobmff", "matroska", "ogg", "serde"] }
craft-menu = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b" }
craft-mesh = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b", features = ["egui"] }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b" }
craft-text = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b" }
craft-timeline = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b", features = ["serde", "xml", "otio"] }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b", features = ["serde", "color_fonts", "native-windows"] }
craft-update = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b" }
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b", features = ["egui"] }
craft-zip = { git = "https://github.com/storytold/craft-libs", rev = "d23f5f36bb9657159ba5468aa9c92d939786922b" }


# Shared Craft AI runtime (`storytold/craft-ai-integrations` — single `craft-ai-core` identity)
craft-ai-client = { git = "https://github.com/storytold/craft-ai-integrations", rev = "0e553407716e958c6281d5b6df0a9554fc5632b7" }
craft-ai-core = { git = "https://github.com/storytold/craft-ai-integrations", rev = "0e553407716e958c6281d5b6df0a9554fc5632b7" }
craft-ai-features = { git = "https://github.com/storytold/craft-ai-integrations", rev = "0e553407716e958c6281d5b6df0a9554fc5632b7" }
craft-ai-native = { git = "https://github.com/storytold/craft-ai-integrations", rev = "0e553407716e958c6281d5b6df0a9554fc5632b7" }

# System, serialization, and CLI foundations
arboard = { version = "3", features = ["wayland-data-control"] }
clap = { version = "4", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
log = "0.4"
rustix = { version = "1", features = ["fs", "net", "process"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"

# Reviewed ArtCraft `storytold/egui` and `storytold/winit` commits
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.package.symphonia-bundle-flac]
overflow-checks = false

[profile.release]
lto = "thin"
codegen-units = 1
