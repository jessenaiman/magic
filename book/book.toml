[book]
title = "Magic Studio Documentation"
authors = ["Jesse Naiman"]
description = "Developer, architecture, file format, CLI, MCP, and control-protocol documentation for Magic Studio in the ArtCraft suite."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "coal"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/jessenaiman/magic"
edit-url-template = "https://github.com/jessenaiman/magic/edit/main/book/src/{path}"
additional-css = ["theme/magic-book.css"]
no-section-label = false

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 25
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 2
