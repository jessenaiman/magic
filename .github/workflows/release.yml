name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  git-sources:
    uses: storytold/craft-common-actions/.github/workflows/git-sources.yml@main

  contributors:
    if: github.event_name == 'workflow_dispatch'
    uses: storytold/craft-common-actions/.github/workflows/refresh-contributors.yml@main
    secrets: inherit

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [git-sources]
    uses: storytold/craft-common-actions/.github/workflows/release.yml@main
    with:
      app-package: magic
      cli-package: magic-cli
      linux-apt-packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
    secrets: inherit
