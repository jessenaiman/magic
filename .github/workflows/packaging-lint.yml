name: Packaging Lint

on:
  push:
    branches: [main, release]
    paths:
      - ".github/workflows/**"
      - "packaging/**"
      - "assets/app-icon/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "packaging/**"
      - "assets/app-icon/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            *.github.com:443
            *.githubusercontent.com:443
            *.microsoft.com:443
            *.ubuntu.com:80
            *.ubuntu.com:443
            api.github.com:443
            archive.ubuntu.com:80
            archive.ubuntu.com:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            github.com:443
            *.dotsrc.org:443
            *.kernel.org:443
            mirrors.dotsrc.org:443
            mirrors.edge.kernel.org:443
            objects.githubusercontent.com:443
            packages.microsoft.com:443
            release-assets.githubusercontent.com:443
            security.ubuntu.com:80
            security.ubuntu.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The shared PowerShell check requires this directory even when no Windows scripts ship.
      - name: Prepare optional Windows packaging directory
        run: mkdir -p packaging/windows
      - name: Run shared packaging lint
        uses: storytold/craft-common-actions/actions/packaging-lint@main
      - name: Check source installer
        run: python3 packaging/tests/test_install.py
