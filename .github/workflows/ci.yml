name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  git-sources:
    uses: storytold/craft-common-actions/.github/workflows/git-sources.yml@main

  gate:
    needs: [git-sources]
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      packages: -p craft-util -p craft-scribbles -p magic-engine -p magic-mcp -p magic-cli -p magic -p magic-tui -p xtask
      linux-apt-packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      macos-test: true
      windows-build: true
    secrets: inherit
