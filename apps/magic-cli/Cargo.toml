[package]
name = "magic-cli"
description = "Magic Studio CLI and MCP server (`magic-cli` and `magic-mcp`)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "magic-cli"

[lints]
workspace = true

[[bin]]
name = "magic-cli"
path = "src/main.rs"

[[bin]]
name = "magic-mcp"
path = "src/mcp_bin.rs"

[dependencies]
clap = { workspace = true }
magic-engine = { workspace = true }
magic-mcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
